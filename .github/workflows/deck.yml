name: deck-build

# Lichii for the Steam Deck: the same commit and PGO profile as each upstream release (build-N),
# compiled for the Deck's CPU (Zen 2) and published here as release deck-N. Steps follow the
# linux-x86_64-pgo job of zortos293/Lichii's release-binaries.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release to build (build-N). Empty means the newest.
        required: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

env:
  UPSTREAM: zortos293/Lichii
  PGO_LLVM_VERSION: "23"
  ASSET: lichii-linux-x86_64-deck.AppImage

concurrency:
  group: deck-build
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.pick.outputs.number }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Pick the upstream release
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$WANTED"
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/$UPSTREAM/releases?per_page=30" \
              --jq '[.[] | select(.tag_name | test("^build-[0-9]+$"))] | max_by(.tag_name | ltrimstr("build-") | tonumber) | .tag_name')
          fi
          [[ "$tag" =~ ^build-([0-9]+)$ ]] || { echo "not a build-N tag: $tag"; exit 1; }
          number="${BASH_REMATCH[1]}"
          if gh release view "deck-$number" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "deck-$number already published"
            exit 0
          fi
          sha=$(gh api "repos/$UPSTREAM/commits/$tag" --jq .sha)
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "building $tag ($sha) as deck-$number"

  build:
    needs: pick
    if: needs.pick.outputs.number != ''
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
      NUMBER: ${{ needs.pick.outputs.number }}
      SHA: ${{ needs.pick.outputs.sha }}
    steps:
      - name: Check out the upstream commit
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.SHA }}

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Install clang
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$PGO_LLVM_VERSION main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-$PGO_LLVM_VERSION" "lld-$PGO_LLVM_VERSION"
          test -s eglantine.profdata

      - name: Restore CPM downloads
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-deck-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: cpm-deck-

      - name: Restore compiler objects
        uses: actions/cache@v4
        with:
          path: .ccache
          key: objects-deck-${{ env.SHA }}
          restore-keys: objects-deck-

      # The upstream PGO flags plus the zen2 preset (-march=znver2 -mtune=znver2, CMakeLists.txt).
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          profile="-fprofile-use=$PWD/eglantine.profdata -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF -DYUZU_USE_BUNDLED_QT=OFF \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" -DYUZU_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF -DUSE_CCACHE=ON \
            "-DLICHII_BUILD_TAG=deck-$NUMBER" -DLICHII_BUILD_PLATFORM=linux-x86_64-deck \
            -DYUZU_BUILD_PRESET=zen2 \
            "-DCMAKE_C_COMPILER=clang-$PGO_LLVM_VERSION" \
            "-DCMAKE_CXX_COMPILER=clang++-$PGO_LLVM_VERSION" \
            "-DCMAKE_EXE_LINKER_FLAGS=-B/usr/lib/llvm-$PGO_LLVM_VERSION/bin -fuse-ld=lld" \
            "-DCMAKE_C_FLAGS=$profile" "-DCMAKE_CXX_FLAGS=$profile"
          grep -q -- '-march=znver2' build/release/build.ninja

      - name: Build
        shell: bash
        run: |
          ccache --zero-stats
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          ccache --show-stats

      - name: Package AppImage
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/lichii
          test -x build/release/bin/eden-cli
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x "$tools"/*.AppImage
          icon="$RUNNER_TEMP/io.github.zortos293.lichii.png"
          cp dist/lichii.png "$icon"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export EXTRA_QT_MODULES=waylandcompositor
          export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
          export LDAI_VERSION="deck-$NUMBER-${SHA::7}"
          export LDAI_OUTPUT="$ASSET"
          export OUTPUT="$ASSET"
          export ARCH=x86_64
          mkdir -p AppDir/usr/bin
          cp build/release/bin/nx2_switches.txt AppDir/usr/bin/
          "$tools/linuxdeploy-x86_64.AppImage" --appdir AppDir \
            --executable build/release/bin/lichii \
            --executable build/release/bin/eden-cli \
            --desktop-file dist/io.github.zortos293.lichii.desktop \
            --icon-file "$icon" \
            --plugin qt \
            --output appimage
          test -s "$ASSET"

      # GitHub records a sha256 digest for every release asset, which QuietDeck checks before installing.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "deck-$NUMBER" "$ASSET" -R "$GITHUB_REPOSITORY" \
            --title "Lichii for Steam Deck, build $NUMBER (${SHA::7})" \
            --notes "zortos293/Lichii build-$NUMBER (${SHA}) compiled with clang $PGO_LLVM_VERSION, the upstream eglantine.profdata PGO profile and -march=znver2 -mtune=znver2 for the Steam Deck's Zen 2 CPU."
